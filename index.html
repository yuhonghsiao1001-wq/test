<head>

  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <style>
    :root {
      --excel-green: #107c41;
      --excel-green-dark: #0b552c;
      --excel-green-light: #e8f5e9;
      --ribbon-bg: #f3f2f1;
      --border-gray: #d4d4d4;
      --cell-border: #e1dfdd;
      --header-bg: #f8f9fa;
      --header-text: #495057;
      --select-border: #107c41;
      --text-main: #212529;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "微軟正黑體", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: #ffffff;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 11px;
    }

    /* 頂部 Excel 綠色標題列 */
    .title-bar {
      background-color: var(--excel-green);
      color: white;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 12px;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      font-weight: 900;
      background: white;
      color: var(--excel-green);
      width: 20px;
      height: 20px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .auto-save {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .file-title {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    .title-center {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 4px 14px;
      width: 320px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      cursor: text;
    }

    .title-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .boss-key-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #e8f5e9;
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 3px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .boss-key-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.45);
    }
    .boss-key-btn:active {
      background: rgba(0, 0, 0, 0.15);
    }

    /* 功能區選單分頁 */
    .ribbon-tabs {
      background-color: var(--excel-green);
      display: flex;
      padding: 0 10px;
      color: white;
      font-size: 12px;
    }

    .ribbon-tab {
      padding: 6px 14px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      opacity: 0.9;
    }

    .ribbon-tab.active {
      background: var(--ribbon-bg);
      color: var(--excel-green);
      font-weight: 600;
      border-bottom: 3px solid var(--excel-green);
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
      opacity: 1;
    }

    /* 工具列 */
    .ribbon-toolbar {
      background: var(--ribbon-bg);
      border-bottom: 1px solid var(--border-gray);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 2px 10px;
      gap: 12px;
      overflow-x: auto;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-right: 1px solid #ddd;
      padding-right: 12px;
      height: 100%;
    }

    .btn-tool {
      background: transparent;
      border: 1px solid transparent;
      padding: 4px 6px;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: #333;
    }
    .btn-tool:hover { background: #e5e5e5; border-color: #ccc; }

    /* 公式列 (發言輸入框) */
    .formula-bar-container {
      display: flex;
      align-items: center;
      background: white;
      border-bottom: 1px solid var(--border-gray);
      height: 32px;
      padding: 2px 8px;
      gap: 8px;
    }

    .name-box {
      width: 75px;
      height: 24px;
      border: 1px solid var(--border-gray);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #444;
      background: #fafafa;
      font-size: 11px;
    }

    .formula-icon {
      font-style: italic;
      font-family: "Times New Roman", serif;
      font-weight: bold;
      color: #777;
      font-size: 15px;
      padding: 0 4px;
    }

    .formula-input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
    }

    .formula-input {
      width: 100%;
      height: 24px;
      border: 1px solid transparent;
      padding: 0 8px;
      font-size: 12px;
      outline: none;
      user-select: text;
    }

    .formula-input:focus {
      border: 1px solid var(--select-border);
      background: #fff;
    }

    .formula-hint {
      position: absolute;
      right: 8px;
      font-size: 11px;
      color: #888;
      pointer-events: none;
    }

    /* 試算表主體區 */
    .sheet-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
      position: relative;
    }

    .table-container {
      flex: 1;
      overflow-y: scroll;
      overflow-x: auto;
      background: #fff;
    }

    table.excel-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      font-size: 11px;
    }

    table.excel-table th, table.excel-table td {
      border: 1px solid var(--cell-border);
      padding: 3px 6px;
      height: 24px;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    table.excel-table th {
      background: var(--header-bg);
      color: var(--header-text);
      font-weight: 600;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #bbb;
      font-size: 11px;
    }

    /* 各欄位寬度與對齊 */
    .col-idx { width: 36px; background: #f0f0f0; text-align: center; color: #777; }
    .col-date { width: 85px; text-align: center; font-family: monospace; }
    .col-size { width: 55px; text-align: center; }
    .col-weight { width: 65px; text-align: right; font-family: monospace; }
    .col-plate { width: 80px; text-align: center; font-family: monospace; font-weight: bold; }
    .col-station { width: 70px; text-align: center; }
    .col-container-no { width: 125px; text-align: center; font-family: monospace; color: #1e3a8a; }
    .col-origin { width: 110px; text-align: left; }
    .col-dest { width: 110px; text-align: left; }
    .col-fare { width: 75px; text-align: right; font-family: monospace; color: #0f5132; }
    .col-alloc-fare { width: 75px; text-align: right; font-family: monospace; color: #0b552c; }
    .col-memo { width: auto; min-width: 200px; color: #111; user-select: text; }

    tr.chat-row:hover td {
      background-color: #f7fafc;
    }

    tr.chat-row.selected td {
      outline: 2px solid var(--select-border);
      outline-offset: -2px;
      background: rgba(16, 124, 65, 0.04);
    }

      background: #f3f2f1;
      border-top: 1px solid var(--border-gray);
      height: 28px;
