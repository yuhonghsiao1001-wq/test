<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貨櫃內陸運送運費請款核算明細表.xlsx - Excel</title>
  <!-- MQTT 雲端即時連線庫 (免伺服器、跨電腦即時連線、純記憶體不存檔) -->
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <style>
    :root {
      --excel-green: #107c41;
      --excel-green-dark: #0b552c;
      --excel-green-light: #e8f5e9;
      --ribbon-bg: #f3f2f1;
      --border-gray: #d4d4d4;
      --cell-border: #d4d4d4;
      --header-bg: #f2f2f2;
      --header-text: #000000;
      --select-border: #107c41;
      --text-main: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'PMingLiU', '新細明體', 'Segoe UI', -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background: #ffffff;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 11px;
    }

    /* 頂部 Excel 綠色標題列 */
    .title-bar {
      background-color: var(--excel-green);
      color: white;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 12px;
      font-family: 'Segoe UI', sans-serif;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      font-weight: 900;
      background: white;
      color: var(--excel-green);
      width: 20px;
      height: 20px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .auto-save {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .file-title {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    .title-center {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 4px 14px;
      width: 320px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      cursor: text;
    }

    .title-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .boss-key-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #e8f5e9;
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 3px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .boss-key-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.45);
    }

    /* Ribbon 功能區 */
    .ribbon-tabs {
      background-color: var(--excel-green);
      display: flex;
      padding: 0 10px;
      color: white;
      font-size: 12px;
      font-family: 'Segoe UI', sans-serif;
    }

    .ribbon-tab {
      padding: 5px 14px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      opacity: 0.9;
    }

    .ribbon-tab.active {
      background: var(--ribbon-bg);
      color: var(--excel-green);
      font-weight: 600;
      border-bottom: 3px solid var(--excel-green);
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
      opacity: 1;
    }

    .ribbon-toolbar {
      background: var(--ribbon-bg);
      border-bottom: 1px solid var(--border-gray);
      height: 56px;
      display: flex;
      align-items: center;
      padding: 2px 10px;
      gap: 12px;
      overflow-x: auto;
      font-family: 'Segoe UI', sans-serif;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-right: 1px solid #ddd;
      padding-right: 12px;
      height: 100%;
    }

    .btn-tool {
      background: transparent;
      border: 1px solid transparent;
      padding: 3px 6px;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: #333;
    }
    .btn-tool:hover { background: #e5e5e5; border-color: #ccc; }

    /* 公式列 (發言輸入框) */
    .formula-bar-container {
      display: flex;
      align-items: center;
      background: white;
      border-bottom: 1px solid var(--border-gray);
      height: 30px;
      padding: 2px 8px;
      gap: 8px;
    }

    .name-box {
      width: 75px;
      height: 22px;
      border: 1px solid var(--border-gray);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #333;
      background: #fafafa;
      font-size: 11px;
      font-family: 'Segoe UI', monospace;
    }

    .formula-icon {
      font-style: italic;
      font-family: "Times New Roman", serif;
      font-weight: bold;
      color: #777;
      font-size: 14px;
      padding: 0 4px;
    }

    .formula-input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
    }

    .formula-input {
      width: 100%;
      height: 22px;
      border: 1px solid transparent;
      padding: 0 8px;
      font-size: 11px;
      outline: none;
      user-select: text;
    }

    .formula-input:focus {
      border: 1px solid var(--select-border);
      background: #fff;
    }

    .formula-hint {
      position: absolute;
      right: 8px;
      font-size: 11px;
      color: #888;
      pointer-events: none;
      font-family: 'Segoe UI', sans-serif;
    }

    /* 試算表主體區 (緊湊密集、還原截圖格式) */
    .sheet-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
      position: relative;
    }

    .table-container {
      flex: 1;
      overflow-y: scroll;
      overflow-x: auto;
      background: #fff;
    }

    table.excel-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      font-size: 11px;
      color: #000;
    }

    table.excel-table th, table.excel-table td {
      border: 1px solid var(--cell-border);
      padding: 2px 4px;
      height: 21px;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      line-height: 1.2;
    }

    table.excel-table th {
      background: var(--header-bg);
      color: var(--header-text);
      font-weight: normal;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      border: 1px solid #b5b5b5;
    }

    /* 截圖對應欄位寬度與對齊 */
    .col-idx { width: 34px; background: #e9e9e9; text-align: center; color: #555; }
    .col-date { width: 75px; text-align: center; font-family: 'Segoe UI', monospace; }
    .col-size { width: 42px; text-align: center; }
    .col-weight { width: 50px; text-align: center; }
    .col-plate { width: 72px; text-align: center; font-family: 'Segoe UI', monospace; }
    .col-station { width: 52px; text-align: center; }
    .col-container-no { width: 110px; text-align: center; font-family: 'Segoe UI', monospace; }
    .col-origin { width: 95px; text-align: left; }
    .col-dest { width: 95px; text-align: left; }
    .col-fare { width: 65px; text-align: right; font-family: 'Segoe UI', monospace; }
    .col-alloc-fare { width: 68px; text-align: right; font-family: 'Segoe UI', monospace; }
    .col-memo { width: auto; min-width: 220px; text-align: left; user-select: text; }

    /* 截圖中偶爾出現的異常紅色字樣標示 */
    tr.alert-red td {
      color: #d90429 !important;
    }

    tr.chat-row:hover td {
      background-color: #f1f7fd;
    }

    tr.chat-row.selected td {
      outline: 1.5px solid var(--select-border);
      outline-offset: -1.5px;
      background: rgba(16, 124, 65, 0.05);
    }

    /* 底部狀態列 */
    .bottom-bar {
      background: #f3f2f1;
      border-top: 1px solid var(--border-gray);
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 11px;
      color: #444;
      font-family: 'Segoe UI', sans-serif;
    }

    .sheet-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .sheet-tab {
      padding: 2px 14px;
      background: #e1dfdd;
      border: 1px solid #ccc;
      border-bottom: none;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
      cursor: pointer;
    }

    .sheet-tab.active {
      background: white;
      color: var(--excel-green);
      font-weight: bold;
      border-bottom: 2px solid white;
    }

    .status-stats {
      display: flex;
      gap: 14px;
      font-family: 'Segoe UI', monospace;
      font-size: 11px;
    }

    /* 登入視窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: 'Segoe UI', sans-serif;
    }

    .excel-modal {
      background: white;
      width: 440px;
      border: 1px solid #888;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      border-radius: 4px;
      overflow: hidden;
    }

    .modal-header {
      background: var(--excel-green);
      color: white;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-weight: 600;
      color: #333;
    }

    .form-group input, .form-group select {
      padding: 5px 8px;
      border: 1px solid #aaa;
      border-radius: 2px;
      font-size: 12px;
      outline: none;
    }

    .modal-footer {
      background: #f8f9fa;
      padding: 10px 18px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid #ddd;
    }

    .btn-primary {
      background: var(--excel-green);
      color: white;
      border: 1px solid var(--excel-green-dark);
      padding: 5px 16px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: var(--excel-green-dark); }

    /* 老闆鍵畫面 */
    .boss-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #f8f9fa;
      z-index: 99999;
      display: none;
      flex-direction: column;
      padding: 24px 32px;
      overflow-y: auto;
      user-select: text;
      font-family: 'Segoe UI', sans-serif;
    }

    .boss-screen.active {
      display: flex;
    }

    .boss-header {
      border-bottom: 2px solid #000;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .boss-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: white;
      border: 1px solid #ccc;
      padding: 16px;
      border-left: 4px solid var(--excel-green);
    }

    .kpi-title { font-size: 12px; color: #666; margin-bottom: 6px; }
    .kpi-val { font-size: 24px; font-weight: bold; font-family: monospace; color: #111; }
    .kpi-change { font-size: 11px; color: #198754; font-weight: bold; margin-top: 4px; }

    .boss-table-box {
      background: white;
      border: 1px solid #ccc;
      padding: 16px;
    }

    .fixed-room-badge {
      background: #e8f5e9;
      color: #0f5132;
      border: 1px solid #c3e6cb;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <!-- 頂部 Excel 標題列 -->
  <div class="title-bar">
    <div class="title-left">
      <div class="app-icon">X</div>
      <div class="auto-save">
        <span>車隊調度連線</span>
        <span id="connIndicator" style="color:#a7f3d0;">● 連線中</span>
      </div>
      <div class="file-title">貨櫃內陸運送運費請款核算明細表.xlsx - Excel</div>
    </div>
    <div class="title-center">
      <span>🔍</span>
      <span>搜尋櫃號、車號、請款起迄點、備註... (Alt+Q)</span>
    </div>
    <div class="title-right">
      <button class="boss-key-btn" onclick="toggleBossMode()" title="切換運務調度分析報告 (快捷鍵 ESC)">
        <span>📊 運務稽核報表 (ESC)</span>
      </button>
      <span id="userStatusTag" style="font-size:11px; opacity:0.9;">未登入調度員</span>
      <span style="cursor:pointer;" onclick="showLoginModal()">👤</span>
    </div>
  </div>

  <!-- Ribbon 功能區選單標籤 -->
  <div class="ribbon-tabs">
    <div class="ribbon-tab">檔案</div>
    <div class="ribbon-tab active">常用</div>
    <div class="ribbon-tab">插入</div>
    <div class="ribbon-tab">版面配置</div>
    <div class="ribbon-tab">公式</div>
    <div class="ribbon-tab">資料</div>
    <div class="ribbon-tab">校閱</div>
    <div class="ribbon-tab">檢視</div>
  </div>

  <!-- Ribbon 工具列 -->
  <div class="ribbon-toolbar">
    <div class="toolbar-group">
      <button class="btn-tool" onclick="exportToCSV()">
        <span style="font-size:15px;">📥</span>
        <span>匯出請款單</span>
      </button>
      <button class="btn-tool" onclick="manualClear()">
        <span style="font-size:15px;">🧹</span>
        <span>清除資料</span>
      </button>
    </div>

    <div class="toolbar-group">
      <div style="display:flex; flex-direction:column; gap:3px;">
        <select style="font-size:11px; padding:1px 3px;">
          <option>新細明體</option>
          <option>微軟正黑體</option>
          <option>Calibri</option>
        </select>
        <div style="display:flex; gap:3px;">
          <button style="font-weight:bold; width:19px; font-size:10px;">B</button>
          <button style="font-style:italic; width:19px; font-size:10px;">I</button>
          <button style="text-decoration:underline; width:19px; font-size:10px;">U</button>
          <button style="border:1px solid #bbb; width:19px; font-size:10px;">田</button>
        </div>
      </div>
    </div>

    <div class="toolbar-group">
      <div style="display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="jargonFilter" checked style="cursor:pointer;">
        <label for="jargonFilter" style="font-size:11px; cursor:pointer; color:#333;">
          啟用調度作業註記前綴
        </label>
      </div>
    </div>

    <!-- 共用頻道指示 -->
    <div class="toolbar-group" style="border:none;">
      <div class="fixed-room-badge" title="預設所有人皆進入此固定公用調度頻道">
        <span>🚛 預設調度總台：</span>
        <span id="displayRoomTag" style="font-family:monospace; color:#0b552c;">LOGISTICS-MAIN-HQ</span>
        <span style="font-size:10px; color:#555; cursor:pointer; text-decoration:underline;" onclick="promptChangeRoom()">[切換車隊頻道]</span>
      </div>
    </div>
  </div>

  <!-- 公式列 (核心發言輸入框) -->
  <div class="formula-bar-container">
    <div class="name-box" id="activeCellLabel">K1</div>
    <div class="formula-icon">fx</div>
    <div class="formula-input-wrapper">
      <input 
        type="text
